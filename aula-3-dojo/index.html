<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <title>Notas</title>

</head>
<body>

<div class="container text-center">

    <h1>Formulário de Notas</h1>
    
<div class="row">
    <div class="mb-3">
  <label for="formGroupExampleInput" class="form-label">Insira seu nome:</label>
  <input type="text" class="form-control" id="formGroupExampleInput" placeholder="Nome:">
</div>
<h5>Insira suas notas:</h5>
  <div class="col">
    <input type="text" class="form-control" placeholder="Insira sua nota 1:" aria-label="Nota 1">
  </div>
  <div class="col">
    <input type="text" class="form-control" placeholder="Insira sua nota 2:" aria-label="Nota 2">
  </div>
  <div class="col">
    <input type="text" class="form-control" placeholder="Insira sua nota 3:" aria-label="Nota 3">
  </div>
  <div class="col">
    <input type="text" class="form-control" placeholder="Insira sua nota 4:" aria-label="Nota 4">
  </div>
  
</div>
<button type="button" class="btn btn-outline-secondary">Registrar resultado</button>
</div>

</body>
</html>
