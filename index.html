<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

    <div class="container-fluid text-center">

        <div class="row">

            <div class="col bg-primary text-white p-3">
                <h1>Formulário consumindo API ViaCep</h1>
            </div>

        </div>

        <div class="container overflow-hidden">

            <div class="row gy-3">

                <div class="col-6 mx-auto">

                    <div class="p-4 mt-4 border rounded-3 shadow-sm">

                        <h2 class="mb-4">Formulário</h2>

                        <form method="get">

                            <div class="mb-3">

                                <label for="cep" class="form-label text-start w-100">CEP:</label>
                                <input type="text" class="form-control" placeholder="CEP" aria-label="CEP">

                                <label for="Rua" class="form-label text-start w-100">Rua:</label>
                                <input type="text" class="form-control" placeholder="Rua" aria-label="Rua">

                                <label for="Bairro" class="form-label text-start w-100">Bairro:</label>
                                <input type="text" class="form-control" placeholder="Bairro" aria-label="Bairro">

                                <label for="Cidade" class="form-label text-start w-100">Cidade:</label>
                                <input type="text" class="form-control" placeholder="Cidade" aria-label="Cidade">

                                <label for="Estado" class="form-label text-start w-100">Estado:</label>
                                <input type="text" class="form-control" placeholder="Estado" aria-label="Estado">

                                <label for="IBGE" class="form-label text-start w-100">IBGE:</label>
                                <input type="text" class="form-control" placeholder="IBGE" aria-label="IBGE">

                            </div>

                            <input type="submit" value="Enviar" class="btn btn-primary">

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
